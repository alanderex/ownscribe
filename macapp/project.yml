name: Ownscribe
options:
  bundleIdPrefix: dev.p4l.ownscribe
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Keep in step with CFBundleShortVersionString in build-app.sh and the
    # macappRelease tag in Sources/Core/OwnscribeCLI.swift.
    MARKETING_VERSION: "0.15.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  Ownscribe:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: Ownscribe
        PRODUCT_BUNDLE_IDENTIFIER: dev.p4l.ownscribe.menubar
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Ownscribe.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
