name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --only-group dev
      - run: uv run ruff check src/ tests/
      # Documented in CONTRIBUTING but previously unenforced, so the tree drifted.
      - run: uv run ruff format --check src/ tests/
      # Everything is annotated already; this verifies the annotations.
      - run: uv run mypy src/

  test:
    runs-on: macos-15
    env:
      CI: "true"
      # llama-cpp-python builds from source. With native tuning on, llama.cpp compiles
      # for "-mcpu=native+noi8mm" on the runner's virtual CPU, and Xcode 16.4's clang
      # rejects that combination in llama.cpp's i8mm code. The tests never run a
      # model, so a generic arm64 build is enough.
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build Swift helper
        run: bash swift/build.sh
      - run: uv sync --dev
      - run: uv run pytest -v -m "not hardware"

  macapp:
    # The menu-bar app had no automated verification at all: a Swift compile error
    # could land on main unnoticed. build-app.sh needs no Xcode project.
    #
    # Two runners on purpose. macos-15, the oldest image GitHub still offers
    # (macos-14 was retired in November 2026), holds the deployment target honest; the
    # floating latest is what catches SDK-driven breakage, which is the failure mode
    # this job has actually seen — SwiftUI's @State became a macro in a newer SDK and
    # stopped compiling, invisibly to a pinned-old runner.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The app's Foundation-only logic (macapp/Sources/Logic) has a SwiftPM
      # package of its own so it can be unit-tested; build-app.sh cannot run tests.
      - name: Test the app's logic
        run: swift test --package-path macapp
      - name: Build Ownscribe.app
        run: bash macapp/build-app.sh
      - name: Build a side-by-side variant
        run: bash macapp/build-app.sh --variant CI

      # Not just a compile check any more: the bundle is downloadable. Building the
      # app needs Apple's macro plugins, which ship with Xcode and not with the
      # Command Line Tools, so a machine with only the CLT can no longer build it at
      # all. This is the way out that doesn't cost a 10 GB Xcode install.
      #
      # Tarred first because upload-artifact re-zips what it is given and drops the
      # executable bit and the code signature along the way, which would leave an
      # .app that cannot launch.
      - name: Pack the bundle
        run: tar -C macapp/build -czf Ownscribe-app.tar.gz Ownscribe.app
      - uses: actions/upload-artifact@v4
        with:
          name: Ownscribe-app-${{ matrix.os }}
          path: Ownscribe-app.tar.gz
          retention-days: 14
